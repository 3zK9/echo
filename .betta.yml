version: 1
'on':
- push
- manual
stages:
- test
- build
jobs:
  unit-tests:
    network: none
    timeout_seconds: 180
    resources:
      cpu_millis: 500
      memory_mib: 1024
      workspace_mib: 1024
    script:
    - mkdir -p reports
    - cd web
    - node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=../reports/junit.xml
      test/*.test.mjs
    artifacts:
      reports:
        junit:
        - reports/junit.xml
      expire_days: 7
  quality:
    stage: build
    needs:
    - unit-tests
    network: public
    timeout_seconds: 1800
    resources:
      cpu_millis: 2000
      memory_mib: 4096
      workspace_mib: 4096
    variables:
      npm_config_cache: /workspace/.cache/npm
      NEXT_TELEMETRY_DISABLED: '1'
    script:
    - bash scripts/ci/quality.sh
    - mkdir -p dist
    - tar --exclude=.next/cache -czf dist/echo-next-build.tar.gz -C web .next public package.json package-lock.json next.config.ts
    artifacts:
      paths:
      - dist
      expire_days: 7
      max_size_mib: 128
      max_expanded_mib: 256
      max_files: 10000
image: node:22.22.3-bookworm@sha256:46e94f8cf91baab69a2deb3153e74eeffd73c20c7cc1d8432f5b96469eaa0322
